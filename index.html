<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tag Audit Studio</title>
  <meta name="description" content="Audit GTM, GA4 and cookie consent setups and turn the findings into a client-ready report.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='%2316233A'/%3E%3Cpath d='M9 17l5 5 9-12' stroke='%23FFE45C' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <aside class="rail" aria-label="Main navigation">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="4"/><path d="M9 17l5 5 9-12"/></svg>
      <span>Tag Audit Studio</span>
    </div>
    <nav id="nav">
      <button data-view="audit" class="nav-item">New audit</button>
      <div class="nav-group" id="nav-results">
        <button data-view="summary" class="nav-item" disabled>Summary</button>
        <button data-view="consent" class="nav-item" disabled>Consent</button>
        <button data-view="tags" class="nav-item" disabled>Tags</button>
        <button data-view="ids" class="nav-item" disabled>IDs</button>
        <button data-view="live" class="nav-item" disabled>Live test</button>
        <button data-view="findings" class="nav-item" disabled>All findings</button>
        <button data-view="ai" class="nav-item" disabled>AI assistant</button>
      </div>
      <button data-view="settings" class="nav-item nav-bottom">Settings</button>
    </nav>
    <div class="rail-foot">
      <button class="link" id="open-audit">Open saved audit</button>
      <input type="file" id="open-audit-file" accept=".json,application/json" hidden>
    </div>
  </aside>

  <main id="main" tabindex="-1">
    <div id="view"></div>
  </main>

  <div id="print-report" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/engine.js"></script>
  <script src="js/engine-web.js"></script>
  <script src="js/google.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
